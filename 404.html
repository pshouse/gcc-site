<title>Page moved | Gaston Community Church</title>
<script>
// The old SnapPages site left a large tail of indexed URLs — mostly individual
// sermon pages under /media/. Those cannot each get a stub file, so anything
// that reaches this 404 page is routed here instead of dead-ending.
(function () {
  var p = location.pathname.replace(/\/+$/, "").toLowerCase();
  var MAP = {
    "/2026-talent-show": "/Events.dc.html",
    "/about": "/About.dc.html",
    "/contact-us": "/Contact.dc.html",
    "/donate": "/Give.dc.html",
    "/events": "/Events.dc.html",
    "/foreign-mission": "/Ministries.dc.html",
    "/griefshare": "/Ministries.dc.html",
    "/home": "/",
    "/im-new": "/ImNew.dc.html",
    "/local-missions": "/Ministries.dc.html",
    "/media/live": "/Media.dc.html",
    "/men-s-ministry": "/Ministries.dc.html",
    "/ministries": "/Ministries.dc.html",
    "/mission-and-vision": "/About.dc.html",
    "/news-media": "/Media.dc.html",
    "/nursery": "/Ministries.dc.html",
    "/ourbeliefs": "/About.dc.html",
    "/sermons": "/Media.dc.html",
    "/small-groups": "/SmallGroups.dc.html",
    "/small-groups-signup": "/SmallGroups.dc.html",
    "/staff": "/About.dc.html",
    "/women-s-ministry": "/Ministries.dc.html",
    "/worshipleader": "/About.dc.html",
    "/youth-and-kids": "/Ministries.dc.html"
  };
  var to = MAP[p];
  if (!to && p.indexOf("/media") === 0) to = "/Media.dc.html";   // sermons, speakers, topics, scripture
  if (!to && p.indexOf("/page/") === 0) to = "/";                // old SnapPages internal pages
  if (to) location.replace(to);
})();
</script>
